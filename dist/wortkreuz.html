<title>Wortkreuz Deutsch</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;600;700&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&display=swap">
<style>
/* Layout: eine Spalte wie eine Heftseite; im Spiel rückt die Hinweisliste auf breiten Schirmen neben das Gitter.
   Hell = kariertes Schulheft mit königsblauer Tinte und Textmarker. Dunkel = grüne Schultafel mit Kreide. */
:root {
  --paper: #eef2f9; --grid: #d9e2f2; --sheet: #ffffff; --sheet-2: #f5f7fc;
  --ink: #141b3d; --ink-2: #545e88; --rule: #c3cee5; --cell-line: #1d2757;
  --accent: #2340c4; --on-accent: #ffffff; --accent-soft: #e2e8fb;
  --marker: #ffe24a; --marker-soft: #fff6bd; --pencil: #3a4157;
  --red: #c92837; --red-soft: #fde4e6; --green: #0f7d54; --green-soft: #d9f2e5; --gold: #e19a00;
  --shadow: 0 1px 0 rgba(20, 27, 61, .08), 0 10px 24px -14px rgba(20, 27, 61, .35);
  --display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --body: "Atkinson Hyperlegible Next", "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --r: 14px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #11241e; --grid: #183128; --sheet: #1a352c; --sheet-2: #20403a;
    --ink: #f2f5ec; --ink-2: #a9c0b3; --rule: #33594c; --cell-line: #7c9e8f;
    --accent: #ffd866; --on-accent: #1b2a12; --accent-soft: #33503f;
    --marker: #6b9c84; --marker-soft: #2b4c40; --pencil: #e6ede4;
    --red: #ff9a9a; --red-soft: #4c2b2d; --green: #86e3ad; --green-soft: #1f4b39; --gold: #ffd866;
    --shadow: 0 1px 0 rgba(0, 0, 0, .25), 0 10px 24px -14px rgba(0, 0, 0, .8);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #11241e; --grid: #183128; --sheet: #1a352c; --sheet-2: #20403a;
  --ink: #f2f5ec; --ink-2: #a9c0b3; --rule: #33594c; --cell-line: #7c9e8f;
  --accent: #ffd866; --on-accent: #1b2a12; --accent-soft: #33503f;
  --marker: #6b9c84; --marker-soft: #2b4c40; --pencil: #e6ede4;
  --red: #ff9a9a; --red-soft: #4c2b2d; --green: #86e3ad; --green-soft: #1f4b39; --gold: #ffd866;
  --shadow: 0 1px 0 rgba(0, 0, 0, .25), 0 10px 24px -14px rgba(0, 0, 0, .8);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; color: var(--ink); font: 16px/1.5 var(--body);
  background: var(--paper);
  background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 22px 22px; -webkit-tap-highlight-color: transparent;
}
button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; padding: 0; touch-action: manipulation; }
button:focus-visible, summary:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
h1, h2, h3, p { margin: 0; }
h1, h2, h3 { font-family: var(--display); text-wrap: balance; line-height: 1.15; }
svg { display: block; }
#app { max-width: 1000px; margin: 0 auto; padding-inline: 16px; padding-block: 14px 28px; min-height: 100%; }
.screen { display: flex; flex-direction: column; gap: 18px; animation: rise .28s ease both; }
@keyframes rise { from { opacity: .4; transform: translateY(6px); } }

/* ---------- Bausteine ---------- */
.bar { display: flex; align-items: center; gap: 10px; min-height: 44px; }
.bar h1 { font-size: 1.25rem; flex: 1; min-width: 0; }
.bar .sub { display: block; font: 400 .8rem var(--body); color: var(--ink-2); }
.icon-btn { width: 42px; height: 42px; border-radius: 12px; display: grid; place-items: center; background: var(--sheet); border: 1.5px solid var(--rule); flex: none; }
.icon-btn:hover { border-color: var(--accent); }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 6px 11px; border-radius: 999px; background: var(--sheet); border: 1.5px solid var(--rule); font-weight: 700; font-size: .9rem; font-variant-numeric: tabular-nums; white-space: nowrap; }
.chip svg { width: 16px; height: 16px; }
.chip.flame svg { color: var(--red); } .chip.xp svg { color: var(--gold); }
.card { background: var(--sheet); border: 1.5px solid var(--rule); border-radius: var(--r); padding: 16px; box-shadow: var(--shadow); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; padding: 10px 18px; border-radius: 13px; font-weight: 700; background: var(--sheet); border: 1.5px solid var(--rule); text-align: left; }
.btn svg { width: 20px; height: 20px; flex: none; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--on-accent); border-color: var(--accent); box-shadow: 0 4px 0 color-mix(in srgb, var(--accent) 60%, #000); transition: transform .08s, box-shadow .08s; }
.btn.primary:active { transform: translateY(3px); box-shadow: 0 1px 0 color-mix(in srgb, var(--accent) 60%, #000); }
.btn.danger { color: var(--red); border-color: var(--red); }
.btn[disabled] { opacity: .5; cursor: default; }
.label { font-size: .74rem; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-2); font-weight: 700; }
.meter { height: 10px; border-radius: 99px; background: var(--accent-soft); overflow: hidden; }
.meter > i { display: block; height: 100%; border-radius: 99px; background: var(--accent); transition: width .5s ease; }
.stars { display: inline-flex; gap: 2px; color: var(--rule); }
.stars svg { width: 18px; height: 18px; } .stars .on { color: var(--gold); }
.seg { display: flex; gap: 6px; flex-wrap: wrap; }
.seg button { min-width: 52px; min-height: 40px; padding: 6px 12px; border-radius: 11px; border: 1.5px solid var(--rule); background: var(--sheet); font-weight: 700; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.muted { color: var(--ink-2); } .small { font-size: .88rem; }

/* ---------- Start ---------- */
.home-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.wordmark { font: 800 1.15rem var(--display); letter-spacing: -.01em; }
.hero { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 22px; align-items: center; }
.logo { display: grid; grid-template-columns: repeat(4, 34px); grid-template-rows: repeat(5, 34px); gap: 3px; }
.logo b { display: grid; place-items: center; background: var(--sheet); border: 2px solid var(--cell-line); border-radius: 6px; font: 800 1.15rem var(--display); }
.logo b.x { background: var(--marker); color: #141b3d; border-color: #141b3d; }
.hero h1 { font-size: clamp(1.7rem, 6vw, 2.5rem); font-weight: 800; letter-spacing: -.02em; }
.hero p { color: var(--ink-2); max-width: 46ch; margin-top: 6px; }
.play { width: 100%; justify-content: space-between; padding: 14px 18px; min-height: 64px; font-size: 1.1rem; }
.play small { display: block; font-weight: 400; font-size: .85rem; opacity: .9; }
.stage-card { display: flex; flex-direction: column; gap: 12px; }
.stage-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.stage-head h2 { font-size: 1.15rem; }
.duo { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 14px; }
.duo .card { display: flex; flex-direction: column; gap: 10px; }
.duo h2 { font-size: 1.05rem; }
.daily { text-align: left; width: 100%; }
.daily:hover { border-color: var(--accent); }
.daily .row, .row { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.tag { font-size: .78rem; font-weight: 700; padding: 3px 9px; border-radius: 99px; background: var(--marker-soft); color: var(--ink); white-space: nowrap; }
.tag.done { background: var(--green-soft); color: var(--green); }
.menu { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.menu .btn { flex-direction: column; align-items: flex-start; gap: 0; }
.menu .btn small { font-weight: 400; color: var(--ink-2); font-size: .82rem; }
.note { font-size: .85rem; color: var(--ink-2); text-align: center; }

/* ---------- Levelwahl ---------- */
.levels { display: grid; grid-template-columns: repeat(auto-fill, minmax(76px, 1fr)); gap: 10px; }
.lv { aspect-ratio: 1; border-radius: 14px; background: var(--sheet); border: 1.5px solid var(--rule); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; position: relative; }
.lv b { font: 800 1.35rem var(--display); font-variant-numeric: tabular-nums; }
.lv .stars svg { width: 13px; height: 13px; }
.lv.done { background: var(--green-soft); border-color: var(--green); }
.lv.next { border: 2.5px solid var(--accent); box-shadow: var(--shadow); }
.lv.locked { opacity: .55; cursor: default; background: var(--sheet-2); }
.lv.locked svg { width: 16px; height: 16px; color: var(--ink-2); }
.lv em { position: absolute; top: 5px; right: 7px; font: 700 .62rem var(--body); color: var(--ink-2); font-style: normal; }

/* ---------- Spiel ---------- */
.game { display: grid; gap: 12px; grid-template-columns: minmax(0, 1fr); grid-template-areas: "board" "lists" "dock"; }
.board-wrap { grid-area: board; display: grid; place-items: center; padding: 6px 0; }
.board { --size: min(46px, calc((100vw - 34px) / var(--cols))); display: grid; grid-template-columns: repeat(var(--cols), var(--size)); grid-auto-rows: var(--size); }
.cell { position: relative; background: var(--sheet); border: 1.5px solid var(--cell-line); margin: -.75px; display: grid; place-items: center; font: 700 calc(var(--size) * .56) var(--display); color: var(--pencil); border-radius: 0; user-select: none; }
.cell .n { position: absolute; top: 1px; left: 3px; font: 700 calc(var(--size) * .24) var(--body); color: var(--ink-2); line-height: 1.1; }
.cell.sel { background: var(--marker-soft); }
.cell.cur { background: var(--marker); z-index: 2; outline: 2.5px solid var(--accent); outline-offset: -2px; }
.cell.ok { background: var(--green-soft); color: var(--green); }
.cell.ok.sel { background: color-mix(in srgb, var(--green-soft) 70%, var(--marker)); }
.cell.given { color: var(--accent); }
.cell.bad { background: var(--red-soft); color: var(--red); }
.cell.pop span { animation: pop .45s ease both; animation-delay: calc(var(--i) * 55ms); }
.cell.shake { animation: shake .36s ease; }
@keyframes pop { 40% { transform: scale(1.45) rotate(-6deg); } }
@keyframes shake { 20%, 60% { transform: translateX(-4px); } 40%, 80% { transform: translateX(4px); } }
.lists { grid-area: lists; }
.lists summary { cursor: pointer; font-weight: 700; padding: 10px 14px; border-radius: 12px; background: var(--sheet); border: 1.5px solid var(--rule); list-style-position: inside; }
.lists .cols { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); padding-top: 12px; }
.lists ol { list-style: none; margin: 6px 0 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
.lists li button { display: grid; grid-template-columns: 26px minmax(0, 1fr); gap: 4px; width: 100%; text-align: left; padding: 7px 8px; border-radius: 9px; font-size: .92rem; line-height: 1.35; }
.lists li button:hover { background: var(--accent-soft); }
.lists li button b { font-variant-numeric: tabular-nums; }
.lists li.on button { background: var(--marker-soft); }
.lists li.done button { color: var(--green); }
.lists li.done button > span::after { content: " ✓"; font-weight: 700; }
.dock { grid-area: dock; position: sticky; bottom: 0; z-index: 5; background: var(--paper); padding: 8px 0 calc(8px + env(safe-area-inset-bottom, 0px)); border-top: 1.5px solid var(--rule); display: flex; flex-direction: column; gap: 8px; }
.clue { background: var(--sheet); border: 1.5px solid var(--rule); border-radius: 13px; padding: 10px 12px; display: flex; flex-direction: column; gap: 4px; min-height: 76px; }
.clue .meta { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: .76rem; color: var(--ink-2); font-weight: 700; letter-spacing: .04em; text-transform: uppercase; }
.clue .meta b { color: var(--on-accent); background: var(--accent); padding: 1px 8px; border-radius: 99px; letter-spacing: 0; }
.clue .text { font-size: 1.04rem; line-height: 1.35; font-weight: 600; }
.clue .extra { font-size: .92rem; color: var(--ink-2); border-left: 3px solid var(--marker); padding-left: 8px; }
.fb { font-size: .92rem; font-weight: 600; padding: 7px 10px; border-radius: 10px; }
.fb.good { background: var(--green-soft); color: var(--green); }
.fb.bad { background: var(--red-soft); color: var(--red); }
.fb.info { background: var(--accent-soft); }
.tools { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
.tools .btn { min-height: 40px; padding: 6px 8px; font-size: .9rem; border-radius: 11px; }
.tools svg { width: 16px; height: 16px; flex: none; }
.kb { display: flex; flex-direction: column; gap: 5px; }
.kb div { display: flex; gap: 4px; justify-content: center; }
.kb button { flex: 1 1 0; min-width: 0; max-width: 46px; height: 44px; border-radius: 8px; background: var(--sheet); border: 1.5px solid var(--rule); border-bottom-width: 3px; font: 700 1rem var(--display); }
.kb button:active { background: var(--marker); color: #141b3d; transform: translateY(1px); }
.kb button.wide { flex: 1.6 1 0; max-width: 74px; display: grid; place-items: center; }
.kb button.wide svg { width: 20px; height: 20px; }
.kb.mini div { justify-content: flex-start; } .kb.mini button { height: 38px; max-width: 44px; }
.kb.mini span { align-self: center; font-size: .82rem; color: var(--ink-2); margin-right: 4px; }
@media (min-width: 880px) {
  .game { grid-template-columns: minmax(0, 1fr) 330px; grid-template-areas: "board lists" "dock lists"; align-items: start; column-gap: 22px; }
  .board { --size: min(48px, calc(560px / var(--cols))); }
  .dock { position: static; border-top: 0; background: none; }
  .lists summary { display: none; }
  .lists .cols { grid-template-columns: 1fr; padding-top: 0; }
  .lists { background: var(--sheet); border: 1.5px solid var(--rule); border-radius: var(--r); padding: 14px; }
}

/* ---------- Ergebnis ---------- */
.result { align-items: center; text-align: center; }
.result > * { width: 100%; max-width: 620px; }
.result .big { display: flex; justify-content: center; gap: 8px; color: var(--rule); }
.result .big svg { width: 62px; height: 62px; }
.result .big .on { color: var(--gold); animation: star .5s cubic-bezier(.2, 1.6, .4, 1) both; animation-delay: calc(var(--i) * 180ms + 150ms); }
@keyframes star { from { transform: scale(0) rotate(-40deg); opacity: 0; } }
.result h1 { font-size: 2rem; font-weight: 800; }
.gains { display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; }
.unlock { display: flex; gap: 12px; align-items: center; text-align: left; background: var(--marker-soft); border-color: var(--gold); }
.unlock svg { width: 30px; height: 30px; color: var(--gold); flex: none; }
.actions { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
.actions .btn { flex: 1 1 180px; }
.review { text-align: left; display: flex; flex-direction: column; gap: 0; padding: 6px 16px; }
.w { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 10px; padding: 11px 0; border-bottom: 1px solid var(--rule); align-items: start; }
.w:last-child { border-bottom: 0; }
.w h3 { font-size: 1.08rem; } .w h3 i { font-style: normal; font-weight: 500; color: var(--accent); }
.w .en { color: var(--ink-2); font-size: .9rem; }
.w .ex { grid-column: 1 / -1; font-size: .93rem; } .w .ex b { background: var(--marker-soft); padding: 0 3px; border-radius: 4px; }
.w .st { grid-column: 1 / -1; font-size: .8rem; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.hard { width: 40px; height: 40px; border-radius: 11px; display: grid; place-items: center; border: 1.5px solid var(--rule); color: var(--ink-2); }
.hard svg { width: 19px; height: 19px; }
.hard[aria-pressed="true"] { background: var(--red-soft); color: var(--red); border-color: var(--red); }
.confetti { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 20; }
.confetti i { position: absolute; top: -20px; width: 9px; height: 14px; border-radius: 2px; animation: fall 1.9s ease-in forwards; }
@keyframes fall { to { transform: translateY(105vh) rotate(540deg); opacity: .2; } }

/* ---------- Listen, Erfolge, Einstellungen ---------- */
.filters { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; justify-content: space-between; }
.awards { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 10px; }
.award { display: flex; gap: 11px; align-items: center; padding: 12px; border-radius: 13px; background: var(--sheet-2); border: 1.5px dashed var(--rule); color: var(--ink-2); }
.award svg { width: 28px; height: 28px; flex: none; }
.award b { display: block; font-family: var(--display); } .award span { font-size: .84rem; }
.award.on { background: var(--sheet); border: 1.5px solid var(--gold); color: var(--ink); } .award.on svg { color: var(--gold); }
.facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; }
.facts div { background: var(--sheet); border: 1.5px solid var(--rule); border-radius: 13px; padding: 10px 12px; }
.facts b { display: block; font: 800 1.5rem var(--display); font-variant-numeric: tabular-nums; }
.facts span { font-size: .82rem; color: var(--ink-2); }
.set { display: flex; justify-content: space-between; align-items: center; gap: 14px; flex-wrap: wrap; padding: 13px 0; border-bottom: 1px solid var(--rule); }
.set:last-child { border-bottom: 0; }
.set > div:first-child { flex: 1 1 220px; min-width: 0; } .set p { font-size: .86rem; color: var(--ink-2); }
.switch { width: 54px; height: 32px; border-radius: 99px; background: var(--rule); position: relative; flex: none; transition: background .15s; }
.switch::after { content: ""; position: absolute; top: 4px; left: 4px; width: 24px; height: 24px; border-radius: 50%; background: var(--sheet); transition: transform .15s; }
.switch[aria-checked="true"] { background: var(--accent); } .switch[aria-checked="true"]::after { transform: translateX(22px); }
.empty { text-align: center; padding: 26px 16px; color: var(--ink-2); }

@media (max-width: 520px) {
  .hero { gap: 14px; }
  .logo { grid-template-columns: repeat(4, 24px); grid-template-rows: repeat(5, 24px); gap: 2px; }
  .logo b { font-size: .82rem; border-width: 1.5px; border-radius: 4px; }
  .tools .btn span.long { display: none; }
}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

.sysin { position: fixed; top: 30%; left: 0; width: 1px; height: 1px; padding: 0; border: 0; opacity: 0; font-size: 16px; background: transparent; color: transparent; caret-color: transparent; }
</style>
<div id="app"></div>
<script>
/* ===== core.js ===== */
/* ============================================================
   core.js – Namensraum, Lernstufen, Wort-Parser, Zufall
   ============================================================ */
var KW = globalThis.KW = globalThis.KW || {};

/* Lernstufen. Neue Stufe = neuer Eintrag hier + eine Datendatei. */
KW.STAGES = [
  { id: 'A1', name: 'Anfänger',            blurb: 'Alltagswörter, Farben, Zahlen, Essen, Familie', levels: 20, words: [5, 6], clue: { en: 4, def: 3, ex: 3 } },
  { id: 'A2', name: 'Grundkenntnisse',     blurb: 'Wohnen, Wetter, Reisen, häufige Verben',        levels: 20, words: [6, 7], clue: { en: 2, def: 4, ex: 4 } },
  { id: 'B1', name: 'Mittelstufe',         blurb: 'Arbeit, Behörden, Gefühle, Umschreibungen',     levels: 20, words: [6, 7], clue: { en: 0, def: 6, ex: 4 } },
  { id: 'B2', name: 'Fortgeschritten',     blurb: 'Abstrakte Begriffe und Redewendungen',          levels: 20, words: [7, 8], clue: { en: 0, def: 7, ex: 3 } },
  { id: 'C1', name: 'Sehr fortgeschritten', blurb: 'Seltene Wörter, Idiomatik, feine Unterschiede', levels: 20, words: [7, 8], clue: { en: 0, def: 7, ex: 3 } }
];
KW.stage = id => KW.STAGES.find(s => s.id === id);

KW.WORDS = {};      // Stufe -> Wortobjekte
KW.WORD_INDEX = {}; // Lösung (GROSS) -> Wortobjekt

/* Großschreibung, die das ß erhält ('ß'.toUpperCase() wäre 'SS'). */
KW.upper = s => Array.from(s).map(ch => ch === 'ß' ? 'ß' : ch.toUpperCase()).join('');
KW.isLetter = ch => /^[A-ZÄÖÜß]$/.test(ch);

/* Zeilenformat: [Artikel ]Wort|Englisch|Umschreibung|Beispielsatz mit ___ */
KW.addWords = function (stageId, text) {
  const list = KW.WORDS[stageId] = KW.WORDS[stageId] || [];
  text.split('\n').map(l => l.trim()).filter(l => l && !l.startsWith('#')).forEach(line => {
    const [head, en, def, ex] = line.split('|').map(s => (s || '').trim());
    const m = head.match(/^(der|die|das)\s+(.+)$/);
    const lemma = m ? m[2] : head;
    const w = { lemma, article: m ? m[1] : '', answer: KW.upper(lemma), en, def, ex, stage: stageId };
    w.kind = w.article ? 'Nomen' : (/^[a-zäöü]/.test(lemma) && /e[lr]?n$/.test(lemma) && lemma.length > 3 && !KW.NOT_VERBS.has(lemma) ? 'Verb' : 'Wort');
    list.push(w);
    if (!KW.WORD_INDEX[w.answer]) KW.WORD_INDEX[w.answer] = w;
  });
};

/* ===== engine.js ===== */
/* ============================================================
   engine.js – Kreuzworträtsel-Generator (ohne DOM, läuft auch in Node)
   Eingabe: Wortobjekte. Ausgabe: Gitter mit sich kreuzenden Einträgen.
   ============================================================ */
(function (KW) {
  const MAX_SHORT = 11, MAX_LONG = 12;

  function tryLayout(words, target, rand) {
    const cells = new Map();           // "r,c" -> { ch, a: bool, d: bool }
    const placed = [];
    let minR = 0, maxR = 0, minC = 0, maxC = 0;
    const key = (r, c) => r + ',' + c;
    const get = (r, c) => cells.get(key(r, c));

    function fits(letters, r, c, dir) {
      const dr = dir === 'd' ? 1 : 0, dc = dir === 'a' ? 1 : 0, n = letters.length;
      if (get(r - dr, c - dc) || get(r + dr * n, c + dc * n)) return null;
      let cross = 0;
      for (let k = 0; k < n; k++) {
        const rr = r + dr * k, cc = c + dc * k, cell = get(rr, cc);
        if (cell) {
          if (cell.ch !== letters[k] || cell[dir]) return null;
          cross++;
        } else if (get(rr - dc, cc - dr) || get(rr + dc, cc + dr)) return null;
      }
      if (cross === n) return null;
      const h = Math.max(maxR, r + dr * (n - 1)) - Math.min(minR, r) + 1;
      const w = Math.max(maxC, c + dc * (n - 1)) - Math.min(minC, c) + 1;
      if (Math.min(h, w) > MAX_SHORT || Math.max(h, w) > MAX_LONG) return null;
      return cross * 100 - h * w;
    }
    function put(word, letters, r, c, dir) {
      const dr = dir === 'd' ? 1 : 0, dc = dir === 'a' ? 1 : 0;
      letters.forEach((ch, k) => {
        const rr = r + dr * k, cc = c + dc * k, cell = get(rr, cc) || { ch };
        cell[dir] = true; cells.set(key(rr, cc), cell);
        minR = Math.min(minR, rr); maxR = Math.max(maxR, rr); minC = Math.min(minC, cc); maxC = Math.max(maxC, cc);
      });
      placed.push({ word, letters, row: r, col: c, dir });
    }

    const order = words.map(w => ({ w, k: w.answer.length + rand() * 3 })).sort((x, y) => y.k - x.k).map(x => x.w);
    const first = order.shift();
    put(first, Array.from(first.answer), 0, 0, rand() < 0.5 ? 'a' : 'd');
    let crossings = 0, progress = true;
    while (order.length && placed.length < target && progress) {
      progress = false;
      for (let i = 0; i < order.length && placed.length < target; i++) {
        const letters = Array.from(order[i].answer);
        let best = null;
        for (const p of placed) {
          const dir = p.dir === 'a' ? 'd' : 'a';
          for (let pk = 0; pk < p.letters.length; pk++) for (let k = 0; k < letters.length; k++) {
            if (p.letters[pk] !== letters[k]) continue;
            const cr = p.row + (p.dir === 'd' ? pk : 0), cc = p.col + (p.dir === 'a' ? pk : 0);
            const r = cr - (dir === 'd' ? k : 0), c = cc - (dir === 'a' ? k : 0);
            const s = fits(letters, r, c, dir);
            if (s === null) continue;
            const score = s + rand() * 20;
            if (!best || score > best.score) best = { score, r, c, dir };
          }
        }
        if (best) {
          const before = cells.size;
          put(order[i], letters, best.r, best.c, best.dir);
          crossings += letters.length - (cells.size - before);
          order.splice(i, 1); i--; progress = true;
        }
      }
    }
    const h = maxR - minR + 1, w = maxC - minC + 1;
    return { placed, minR, minC, rows: h, cols: w, score: placed.length * 10000 + crossings * 150 - h * w - Math.abs(h - w) * 3 };
  }

  /* Baut ein Rätsel aus bis zu `target` der angebotenen Wörter. */
  KW.buildCrossword = function (words, target, rand, attempts) {
    let best = null;
    for (let i = 0; i < (attempts || 40); i++) {
      const lay = tryLayout(words, target, rand);
      if (!best || lay.score > best.score) best = lay;
    }
    const flip = best.cols > best.rows;            // hochkant passt besser aufs Handy
    let entries = best.placed.map(p => {
      const r = p.row - best.minR, c = p.col - best.minC;
      return flip ? { word: p.word, letters: p.letters, row: c, col: r, dir: p.dir === 'a' ? 'd' : 'a' }
                  : { word: p.word, letters: p.letters, row: r, col: c, dir: p.dir };
    });
    const rows = flip ? best.cols : best.rows, cols = flip ? best.rows : best.cols;
    entries.sort((x, y) => x.row - y.row || x.col - y.col || (x.dir === 'a' ? -1 : 1));
    let num = 0, last = '';
    entries.forEach(e => {
      const k = e.row + ',' + e.col;
      if (k !== last) { num++; last = k; }
      e.num = num;
      e.cells = e.letters.map((_, i) => (e.row + (e.dir === 'd' ? i : 0)) * cols + e.col + (e.dir === 'a' ? i : 0));
    });
    const used = new Set(entries.map(e => e.word));
    return { rows, cols, entries, unused: words.filter(w => !used.has(w)) };
  };
})(KW);

    if (x < mix.en) return 'en';
    x -= mix.en;
    return x < mix.def ? 'def' : 'ex';
  };

  function finish(id, kind, stage, grid, extra) {
    return Object.assign({ id, kind, stageId: stage.id, rows: grid.rows, cols: grid.cols,
      entries: grid.entries.map(e => ({ word: e.word, letters: e.letters, row: e.row, col: e.col, dir: e.dir, num: e.num, cells: e.cells, clue: KW.clueKind(e.word, stage) })) }, extra);
  }

  /* Alle Levels einer Stufe. Nicht verbaute Wörter wandern zurück in die
     Warteschlange, damit sich Wörter so spät wie möglich wiederholen. */
  KW.stageLevels = function (stageId) {
    if (cache[stageId]) return cache[stageId];
    const stage = KW.stage(stageId), pool = KW.WORDS[stageId] || [];
    const rand = KW.rng(KW.hash('stage:' + stageId));
    let queue = KW.shuffle(pool, rand), round = 1;
    const out = [];
    for (let i = 0; i < stage.levels; i++) {
      const t = stage.levels > 1 ? i / (stage.levels - 1) : 0;
      const target = Math.round(stage.words[0] + (stage.words[1] - stage.words[0]) * t + (i % 3 === 2 ? 0.4 : 0));
      const offer = [];
      while (offer.length < target + 3) {
        if (!queue.length) { queue = KW.shuffle(pool, rand); round++; }
        const w = queue.shift();
        if (!offer.includes(w)) offer.push(w);
      }
      const grid = KW.buildCrossword(offer, target, rand, 40);
      queue = grid.unused.concat(queue);
      out.push(finish(stageId + '-' + String(i + 1).padStart(2, '0'), 'level', stage, grid,
        { index: i, number: KW.STAGES.indexOf(stage) * 20 + i + 1, review: round > 1 }));
    }
    return cache[stageId] = out;
  };
  KW.level = function (id) {
    const [stageId, n] = id.split('-');
    return (KW.stageLevels(stageId) || [])[parseInt(n, 10) - 1] || null;
  };
  KW.totalLevels = () => KW.STAGES.reduce((n, s) => n + s.levels, 0);

  /* Tagesrätsel: jeden Tag ein neues, auf allen Geräten dasselbe. */
  KW.dailyPuzzle = function (stageId, date) {
    const stage = KW.stage(stageId), rand = KW.rng(KW.hash('daily:' + stageId + ':' + date));
    const offer = KW.shuffle(KW.WORDS[stageId], rand).slice(0, 11);
    return finish('daily-' + date + '-' + stageId, 'daily', stage, KW.buildCrossword(offer, 8, rand, 50), { date });
  };

  /* Übungsrätsel aus der persönlichen Wortliste. */
  KW.practicePuzzle = function (answers, seed) {
    const words = answers.map(a => KW.WORD_INDEX[a]).filter(Boolean);
    if (words.length < 4) return null;
    const rand = KW.rng(KW.hash('practice:' + seed));
    const offer = KW.shuffle(words, rand).slice(0, 12);
    const stage = KW.stage(offer[0].stage);
    const grid = KW.buildCrossword(offer, 7, rand, 60);
    if (grid.entries.length < 3) return null;
    const p = finish('practice-' + seed, 'practice', stage, grid, {});
    p.entries.forEach(e => { e.clue = KW.clueKind(e.word, KW.stage(e.word.stage)); });
    return p;
  };
})(KW);

/* ============================================================
   store.js – Spielstand. Liegt im LocalStorage des Browsers;
   ein späteres Backend müsste nur load() und save() ersetzen.
   ============================================================ */
(function (KW) {
  const KEY = 'wortkreuz.save.v1';
  const fresh = () => ({
    v: 1, stage: 'A1', xp: 0,
    levels: {},            // id -> { stars, xp, date }
    daily: {},             // Datum -> Sterne
    stats: { correct: 0, wrong: 0, hints: 0, reveals: 0, puzzles: 0, perfect: 0, practice: 0 },
    streak: { count: 0, best: 0, last: '' },
    words: {},             // LÖSUNG -> { ok, bad, hard, seen }
    achievements: {},      // id -> Datum
    session: null,         // angefangenes Rätsel
    settings: { theme: 'system', translations: true, markErrors: true, keyboard: 'auto', motion: true }
  });

  const Store = KW.Store = {
    data: fresh(), persistent: true,
    load() {
      try {
        const raw = localStorage.getItem(KEY);
        if (raw) {
          const saved = JSON.parse(raw), base = fresh();
          this.data = Object.assign(base, saved, {
            stats: Object.assign(base.stats, saved.stats), streak: Object.assign(base.streak, saved.streak),
            settings: Object.assign(base.settings, saved.settings)
          });
        }
      } catch (e) { this.persistent = false; }
      if (!KW.stage(this.data.stage)) this.data.stage = 'A1';
      return this.data;
    },
    save() {
      try { localStorage.setItem(KEY, JSON.stringify(this.data)); this.persistent = true; }
      catch (e) { this.persistent = false; }
    },
    reset() { this.data = fresh(); this.save(); },

    /* ---- Fortschritt ---- */
    isDone(id) { return !!this.data.levels[id]; },
    isUnlocked(level) {
      return level.index === 0 || this.isDone(KW.stageLevels(level.stageId)[level.index - 1].id);
    },
    nextLevel(stageId) {
      const list = KW.stageLevels(stageId);
      return list.find(l => !this.isDone(l.id)) || null;
    },
    stageProgress(stageId) {
      const list = KW.stageLevels(stageId);
      const done = list.filter(l => this.isDone(l.id));
      return { done: done.length, total: list.length, stars: done.reduce((n, l) => n + this.data.levels[l.id].stars, 0) };
    },
    totalDone() { return Object.keys(this.data.levels).length; },
    totalStars() { return Object.values(this.data.levels).reduce((n, l) => n + l.stars, 0); },

    /* ---- Lernserie ---- */
    streakNow() {
      const s = this.data.streak, t = KW.today();
      const y = new Date(); y.setDate(y.getDate() - 1);
      return (s.last === t || s.last === KW.today(y)) ? s.count : 0;
    },
    touchStreak() {
      const s = this.data.streak, t = KW.today();
      if (s.last === t) return false;
      s.count = this.streakNow() + 1; s.last = t; s.best = Math.max(s.best, s.count);
      return true;
    },

    /* ---- Wortliste ---- */
    wordEntry(answer) {
      return this.data.words[answer] = this.data.words[answer] || { ok: 0, bad: 0, hard: false, seen: KW.today() };
    },
    learnedWords() {
      return Object.keys(this.data.words).filter(a => KW.WORD_INDEX[a]).map(a => Object.assign({ word: KW.WORD_INDEX[a] }, this.data.words[a]));
    },

    /* ---- Rang aus XP ---- */
    rank() {
      const names = ['Neuling', 'Wortsammler', 'Silbenjäger', 'Satzbauer', 'Vielleser', 'Sprachfreund', 'Wortakrobat', 'Sprachprofi', 'Wortmeister'];
      const step = 300, i = Math.min(names.length - 1, Math.floor(this.data.xp / step));
      const last = i === names.length - 1;
      return { name: names[i], index: i + 1, into: last ? step : this.data.xp - i * step, step, next: last ? null : names[i + 1] };
    }
  };

  /* ---- Erfolge: jede Regel prüft nur den Spielstand ---- */
  KW.ACHIEVEMENTS = [
    { id: 'first',    name: 'Erster Schritt',  text: 'Löse dein erstes Rätsel.',                 test: d => d.stats.puzzles >= 1 },
    { id: 'perfect',  name: 'Fehlerfrei',      text: 'Löse ein Rätsel mit drei Sternen.',         test: d => d.stats.perfect >= 1 },
    { id: 'perfect5', name: 'Sternensammler',  text: 'Hole zehnmal drei Sterne.',                 test: d => d.stats.perfect >= 10 },
    { id: 'streak3',  name: 'Dranbleiber',     text: 'Lerne drei Tage in Folge.',                 test: d => d.streak.best >= 3 },
    { id: 'streak7',  name: 'Eine ganze Woche', text: 'Lerne sieben Tage in Folge.',              test: d => d.streak.best >= 7 },
    { id: 'streak30', name: 'Gewohnheitstier', text: 'Lerne 30 Tage in Folge.',                   test: d => d.streak.best >= 30 },
    { id: 'words50',  name: 'Wortschatzkiste', text: 'Sammle 50 Wörter in deiner Wortliste.',     test: d => Object.keys(d.words).length >= 50 },
    { id: 'words200', name: 'Wandelndes Lexikon', text: 'Sammle 200 Wörter in deiner Wortliste.', test: d => Object.keys(d.words).length >= 200 },
    { id: 'daily1',   name: 'Tagesform',       text: 'Löse ein Tagesrätsel.',                     test: d => Object.keys(d.daily).length >= 1 },
    { id: 'daily7',   name: 'Stammgast',       text: 'Löse sieben Tagesrätsel.',                  test: d => Object.keys(d.daily).length >= 7 },
    { id: 'practice', name: 'Übung macht den Meister', text: 'Löse ein Übungsrätsel aus deiner Wortliste.', test: d => d.stats.practice >= 1 }
  ].concat(KW.STAGES.map(s => ({
    id: 'stage' + s.id, name: s.id + ' geschafft', text: 'Löse alle ' + s.levels + ' Rätsel der Stufe ' + s.id + '.',
    test: d => Object.keys(d.levels).filter(k => k.startsWith(s.id + '-')).length >= s.levels
  })));
  Store.checkAchievements = function () {
    const fresh = [];
    KW.ACHIEVEMENTS.forEach(a => {
      if (!this.data.achievements[a.id] && a.test(this.data)) { this.data.achievements[a.id] = KW.today(); fresh.push(a); }
    });
    return fresh;
  };
})(KW);

/* ===== game.js ===== */
/* ============================================================
   game.js – Spielregeln für ein laufendes Rätsel (ohne DOM).
   ============================================================ */
(function (KW) {
  const UMLAUT = { 'Ä': 'A', 'Ö': 'O', 'Ü': 'U', 'ß': 'S' };
  const plain = s => Array.from(s).map(ch => UMLAUT[ch] || ch).join('');

  /* Erklärt, was an einer falschen Eingabe nicht stimmt. */
  KW.explainError = function (typed, answer, wrongCount) {
    if (plain(typed) === plain(answer)) {
      return answer.includes('ß') && !typed.includes('ß')
        ? 'Fast richtig! Hier schreibt man ß – nach langem Vokal oder Doppellaut steht ß statt s.'
        : 'Fast richtig! Achte auf den Umlaut: a/ä, o/ö und u/ü sind verschiedene Buchstaben.';
    }
    if (Array.from(typed).sort().join('') === Array.from(answer).sort().join('')) {
      return /IE|EI/.test(answer)
        ? 'Alle Buchstaben stimmen, nur die Reihenfolge nicht. Merke: „ie“ klingt wie langes i, „ei“ wie „ai“.'
        : 'Alle Buchstaben stimmen, nur die Reihenfolge nicht.';
    }
    if (wrongCount === 1) return 'Nur ein Buchstabe stimmt noch nicht.';
    if (wrongCount >= answer.length - 1) return 'Das ist ein anderes Wort. Lies den Hinweis noch einmal oder hol dir einen Tipp.';
    return wrongCount + ' Buchstaben stimmen noch nicht.';
  };

  KW.Session = class {
    constructor(puzzle, saved) {
      this.puzzle = puzzle;
      const n = puzzle.rows * puzzle.cols;
      this.solution = new Array(n).fill('');
      this.cellEntries = Array.from({ length: n }, () => []);
      puzzle.entries.forEach((e, i) => e.cells.forEach((c, k) => { this.solution[c] = e.letters[k]; this.cellEntries[c].push(i); }));
      const ok = saved && saved.id === puzzle.id && saved.fill && saved.fill.length === n;
      this.fill = ok ? saved.fill.slice() : new Array(n).fill('');
      this.solved = new Set(ok ? saved.solved : []);
      this.revealed = new Set(ok ? saved.revealed : []);   // ganz aufgedeckte Wörter
      this.given = new Set(ok ? saved.given : []);          // einzeln aufgedeckte Felder
      this.tips = ok ? Object.assign({}, saved.tips) : {};
      this.missed = ok ? Object.assign({}, saved.missed) : {};
      this.penalty = ok ? saved.penalty : 0;
      this.lastTry = {};
      this.pending = {};   // Wort -> Felder, die nach einem Fehlversuch noch nicht überschrieben wurden
      this.locked = new Set();
      this.solved.forEach(i => puzzle.entries[i].cells.forEach(c => this.locked.add(c)));
      this.given.forEach(c => this.locked.add(c));
    }
    serialize() {
      return { id: this.puzzle.id, fill: this.fill, solved: [...this.solved], revealed: [...this.revealed], given: [...this.given],
        tips: this.tips, missed: this.missed, penalty: this.penalty };
    }
    typed(i) { return this.puzzle.entries[i].cells.map(c => this.fill[c] || ' ').join(''); }
    isFull(i) { return this.puzzle.entries[i].cells.every(c => this.fill[c]); }
    get complete() { return this.solved.size === this.puzzle.entries.length; }

    /* Setzt einen Buchstaben und prüft alle betroffenen, vollständig gefüllten Wörter. */
    setLetter(cell, ch) {
      if (this.locked.has(cell)) return [];
      this.fill[cell] = ch;
      this.cellEntries[cell].forEach(i => this.pending[i] && this.pending[i].delete(cell));
      return ch ? this.cellEntries[cell].map(i => this.check(i)).filter(Boolean) : [];
    }
    check(i) {
      if (this.solved.has(i) || !this.isFull(i)) return null;
      const e = this.puzzle.entries[i], typed = this.typed(i), answer = e.word.answer;
      if (typed === answer) {
        this.solved.add(i); e.cells.forEach(c => this.locked.add(c));
        return { entry: i, correct: true, clean: !this.revealed.has(i) && !this.missed[i] && !this.tips[i] };
      }
      if (this.pending[i] && this.pending[i].size) return null;   // wird gerade korrigiert: erst prüfen, wenn alle roten Felder neu sind
      const wrong = e.cells.filter(c => this.fill[c] !== this.solution[c]);
      this.pending[i] = new Set(wrong.filter(c => !this.locked.has(c)));
      const repeat = this.lastTry[i] === typed;
      this.lastTry[i] = typed;
      if (!repeat) { this.missed[i] = (this.missed[i] || 0) + 1; this.penalty += 1; }
      return { entry: i, correct: false, repeat, wrongCells: wrong, message: KW.explainError(typed, answer, wrong.length) };
    }
    /* Nächster Tipp: weitere Hinweisarten, die noch nicht gezeigt wurden. */
    clueKinds(i, translations) {
      const e = this.puzzle.entries[i];
      let main = e.clue;
      if (main === 'en' && !translations) main = 'def';
      const rest = ['def', 'ex', 'en'].filter(k => k !== main && (k !== 'en' || translations));
      return [main].concat(rest);
    }
    takeTip(i, translations) {
      const kinds = this.clueKinds(i, translations), have = this.tips[i] || 0;
      if (have >= kinds.length - 1) return false;
      this.tips[i] = have + 1; this.penalty += 1;
      return true;
    }
    revealLetter(cell) {
      if (this.locked.has(cell) || !this.solution[cell]) return null;
      this.fill[cell] = this.solution[cell];
      this.given.add(cell); this.locked.add(cell); this.penalty += 1;
      this.cellEntries[cell].forEach(i => { this.tips[i] = this.tips[i] || 0; this.missed[i] = this.missed[i] || 0; });
      return this.cellEntries[cell].map(i => { const r = this.check(i); if (r) r.clean = false; return r; }).filter(Boolean);
    }
    revealWord(i) {
      if (this.solved.has(i)) return [];
      const e = this.puzzle.entries[i];
      this.revealed.add(i); this.penalty += 3;
      e.cells.forEach(c => { this.fill[c] = this.solution[c]; });
      const touched = new Set(); e.cells.forEach(c => this.cellEntries[c].forEach(j => touched.add(j)));
      return [...touched].map(j => { const r = this.check(j); if (r && j === i) r.clean = false; return r; }).filter(Boolean);
    }
    stars() { return this.penalty <= 1 ? 3 : this.penalty <= 5 ? 2 : 1; }
  };

  /* Wertet ein fertiges Rätsel aus und schreibt alles in den Spielstand. */
  KW.finishPuzzle = function (session) {
    const S = KW.Store, d = S.data, p = session.puzzle, stage = KW.stage(p.stageId);
    const stars = session.stars(), mult = 1 + KW.STAGES.indexOf(stage) * 0.25;
    const own = p.entries.filter((e, i) => !session.revealed.has(i)).length;
    let xp = Math.round((own * 10 + stars * 10) * mult);
    if (p.kind === 'daily') xp += 40;
    if (p.kind === 'practice') xp = Math.round(xp * 0.6);
    const before = S.rank();
    let gained = xp, replay = false;

    p.entries.forEach((e, i) => {
      const w = S.wordEntry(e.word.answer);
      const clean = !session.revealed.has(i) && !session.missed[i];
      if (clean) { w.ok++; if (p.kind === 'practice' && w.auto) { w.hard = false; w.auto = false; } }
      else { w.bad++; if (session.revealed.has(i) || session.missed[i] >= 2) { if (!w.hard) w.auto = true; w.hard = true; } }
      w.seen = KW.today();
    });
    d.stats.correct += p.entries.filter((e, i) => !session.revealed.has(i)).length;
    d.stats.wrong += Object.values(session.missed).reduce((a, b) => a + b, 0);
    d.stats.hints += Object.values(session.tips).reduce((a, b) => a + b, 0) + session.given.size;
    d.stats.reveals += session.revealed.size;

    if (p.kind === 'level') {
      const old = d.levels[p.id];
      if (old) { replay = true; gained = Math.max(0, xp - old.xp); }
      d.levels[p.id] = { stars: Math.max(stars, old ? old.stars : 0), xp: Math.max(xp, old ? old.xp : 0), date: KW.today() };
    } else if (p.kind === 'daily') {
      if (d.daily[p.date] != null) { replay = true; gained = 0; }
      d.daily[p.date] = Math.max(stars, d.daily[p.date] || 0);
    } else d.stats.practice++;
    if (!replay) { d.stats.puzzles++; if (stars === 3) d.stats.perfect++; }
    d.xp += gained;
    const streakUp = S.touchStreak();
    d.session = null;
    const achievements = S.checkAchievements();
    S.save();
    const after = S.rank();
    return { stars, xp: gained, replay, streakUp, streak: d.streak.count, achievements, rankUp: after.index > before.index ? after : null,
      stageDone: p.kind === 'level' && !replay && S.stageProgress(p.stageId).done === stage.levels };
  };
})(KW);

    return `<div class="screen">
      <div class="home-top"><span class="wordmark">Wortkreuz</span>
        <span class="seg"><span class="chip flame" title="Lernserie">${I.flame}${S.streakNow()} ${S.streakNow() === 1 ? 'Tag' : 'Tage'}</span><span class="chip xp" title="Erfahrungspunkte">${I.bolt}${d.xp} XP</span></span></div>
      <section class="hero">
        <div class="logo" aria-hidden="true">
          <b style="grid-area:1/3">K</b><b style="grid-area:2/1">W</b><b style="grid-area:2/2">O</b><b class="x" style="grid-area:2/3">R</b><b style="grid-area:2/4">T</b>
          <b style="grid-area:3/3">E</b><b style="grid-area:4/3">U</b><b style="grid-area:5/3">Z</b></div>
        <div><h1>Deutsch lernen, Wort für Wort.</h1><p>${KW.totalLevels()} Kreuzworträtsel von A1 bis C1. Jedes gelöste Wort landet mit Artikel, Übersetzung und Beispielsatz in deiner Wortliste.</p></div>
      </section>
      ${play}
      <section class="card stage-card">
        <div class="stage-head"><div><span class="label">Deine Lernstufe</span><h2>${st.id} · ${st.name}</h2></div>
          <div class="seg" role="group" aria-label="Lernstufe wählen">${KW.STAGES.map(s => `<button data-act="stage" data-id="${s.id}" aria-pressed="${s.id === st.id}">${s.id}</button>`).join('')}</div></div>
        <p class="muted small">${st.blurb}</p>
        <div class="meter" role="img" aria-label="${prog.done} von ${prog.total} Rätseln gelöst"><i style="width:${prog.done / prog.total * 100}%"></i></div>
        <div class="row small"><span>${prog.done} von ${prog.total} Rätseln gelöst</span><span class="muted">${prog.stars} von ${prog.total * 3} Sternen</span></div>
      </section>
      <div class="duo">
        <button class="card daily" data-act="daily">
          <span class="row"><span class="label">Tagesrätsel · ${new Date().toLocaleDateString('de-DE', { day: 'numeric', month: 'long' })}</span><span class="tag ${dailyDone ? 'done' : ''}">${dailyDone ? 'Gelöst' : '+40 XP'}</span></span>
          <h2>${dailyDone ? 'Für heute geschafft' : 'Acht Wörter aus ' + st.id}</h2>
          <span class="muted small">${dailyDone ? 'Morgen wartet ein neues Rätsel. Du kannst das heutige noch einmal spielen.' : 'Jeden Tag ein neues Rätsel. Es hält deine Lernserie am Laufen.'}</span>
        </button>
        <section class="card">
          <span class="row"><span class="label">Rang ${rank.index}</span><span class="small muted">${rank.next ? rank.into + ' / ' + rank.step + ' XP' : 'Höchster Rang'}</span></span>
          <h2>${rank.name}</h2>
          <div class="meter"><i style="width:${rank.into / rank.step * 100}%"></i></div>
          <span class="muted small">${rank.next ? 'Nächster Rang: ' + rank.next : 'Du hast alle Ränge erreicht.'}</span>
        </section>
      </div>
      <nav class="menu">
        <button class="btn" data-act="levels">Level auswählen<small>${S.totalDone()} von ${KW.totalLevels()} gelöst</small></button>
        <button class="btn" data-act="words">Wortliste<small>${learned} ${learned === 1 ? 'Wort' : 'Wörter'}${hard ? ', ' + hard + ' schwierig' : ''}</small></button>
        <button class="btn" data-act="awards">Erfolge<small>${got} von ${KW.ACHIEVEMENTS.length} erreicht</small></button>
        <button class="btn" data-act="settings">Einstellungen<small>Design, Hinweise, Tastatur</small></button>
      </nav>
      ${S.persistent ? '' : '<p class="note">Dieser Browser erlaubt gerade kein Speichern. Dein Fortschritt gilt nur, solange die Seite offen ist.</p>'}
    </div>`;
  }

  /* ---------- Levelwahl ---------- */
  function levels() {
    const id = ui.tabStage || S.data.stage, st = KW.stage(id), list = KW.stageLevels(id), next = S.nextLevel(id), prog = S.stageProgress(id);
    return `<div class="screen">${topBar('Level auswählen', `${st.id} · ${st.name} · ${prog.done} von ${prog.total} gelöst`)}
      <div class="seg" role="group" aria-label="Lernstufe">${KW.STAGES.map(s => `<button data-act="tab" data-id="${s.id}" aria-pressed="${s.id === id}">${s.id}</button>`).join('')}</div>
      <p class="muted small">${st.blurb}. Jedes gelöste Rätsel schaltet das nächste frei. Du kannst jederzeit in einer anderen Stufe beginnen.</p>
      <div class="levels">${list.map(l => {
        const rec = S.data.levels[l.id], open = S.isUnlocked(l);
        return `<button class="lv ${rec ? 'done' : open ? (next && next.id === l.id ? 'next' : '') : 'locked'}" ${open ? `data-act="play" data-id="${l.id}"` : 'disabled'} aria-label="Rätsel ${l.index + 1}${rec ? ', ' + rec.stars + ' Sterne' : open ? '' : ', gesperrt'}">
          ${l.review ? '<em title="Enthält Wörter zur Wiederholung">Wdh.</em>' : ''}<b>${l.index + 1}</b>${rec ? stars(rec.stars) : open ? `<span class="small muted">${l.entries.length} Wörter</span>` : I.lock}</button>`;
      }).join('')}</div></div>`;
  }

  /* ---------- Spiel ---------- */
  function puzzleLabel(p) {
    return p.kind === 'daily' ? 'Tagesrätsel ' + p.stageId : p.kind === 'practice' ? 'Übungsrätsel' : p.stageId + ' · Rätsel ' + (p.index + 1);
  }
  function refOf(p, extra) { return Object.assign({ kind: p.kind, id: p.id, stageId: p.stageId, date: p.date, label: puzzleLabel(p) }, extra); }
  function start(puzzle, ref, resume) {
    const s = new KW.Session(puzzle, resume ? S.data.session : null);
    G = { s, sel: 0, cur: 0, bad: new Set(), fb: null, ref };
    const first = puzzle.entries.findIndex((e, i) => !s.solved.has(i));
    select(first < 0 ? 0 : first, true);
    persist(); go('game');
  }
  function persist() { S.data.session = Object.assign(G.s.serialize(), { ref: G.ref }); S.save(); }
  function resume() {
    const ses = S.data.session, r = ses && ses.ref; let p = null;
    if (r) p = r.kind === 'level' ? KW.level(r.id) : r.kind === 'daily' ? (r.date === KW.today() ? KW.dailyPuzzle(r.stageId, r.date) : null) : KW.practicePuzzle(r.answers || [], r.seed);
    if (!p || p.id !== ses.id) { S.data.session = null; S.save(); return go('home'); }
    start(p, r, true);
  }
  function select(i, jump) {
    G.sel = i;
    const e = G.s.puzzle.entries[i];
    if (jump || !e.cells.includes(G.cur)) G.cur = e.cells.find(c => !G.s.locked.has(c) && !G.s.fill[c]) ?? e.cells.find(c => !G.s.locked.has(c)) ?? e.cells[0];
  }
  const CLUE_LABEL = { en: 'Übersetzung', def: 'Umschreibung', ex: 'Lückensatz' };
  function clueText(e, kind) {
    return kind === 'en' ? `Englisch: „${esc(e.word.en)}“` : kind === 'ex' ? esc(e.word.ex) : esc(e.word.def);
  }
  function game() {
    const p = G.s.puzzle, set = S.data.settings, showKb = set.keyboard === 'always' || (set.keyboard === 'auto' && coarse());
    const starts = {}; p.entries.forEach(e => { starts[e.cells[0]] = e.num; });
    const cells = G.s.solution.map((ch, c) => ch ? `<button class="cell" data-act="cell" data-c="${c}" style="grid-area:${Math.floor(c / p.cols) + 1}/${c % p.cols + 1}" tabindex="-1">${starts[c] ? `<i class="n">${starts[c]}</i>` : ''}<span></span></button>` : '').join('');
    const list = dir => p.entries.map((e, i) => e.dir === dir ? `<li data-e="${i}"><button data-act="entry" data-e="${i}"><b>${e.num}</b><span>${clueText(e, G.s.clueKinds(i, set.translations)[0])} <span class="muted">(${e.letters.length})</span></span></button></li>` : '').join('');
    const row = keys => `<div>${Array.from(keys).map(k => `<button data-act="key" data-k="${k}">${k}</button>`).join('')}</div>`;
    const kb = showKb
      ? `<div class="kb" aria-label="Tastatur">${row('QWERTZUIOPÜ')}${row('ASDFGHJKLÖÄ')}<div>${Array.from('YXCVBNMß').map(k => `<button data-act="key" data-k="${k}">${k}</button>`).join('')}<button class="wide" data-act="key" data-k="DEL" aria-label="Löschen">${I.del}</button></div></div>`
      : `<input id="sysin" class="sysin" type="text" value=" " aria-label="Buchstaben eingeben" autocomplete="off" autocorrect="off" autocapitalize="characters" spellcheck="false" enterkeyhint="next"><div class="kb mini"><div><span>Sonderzeichen:</span>${Array.from('ÄÖÜß').map(k => `<button data-act="key" data-k="${k}">${k}</button>`).join('')}</div></div>`;
    return `<div class="screen">${topBar(puzzleLabel(p), '<span id="count"></span>', '<span id="live" class="chip"></span>')}
      <div class="game">
        <div class="board-wrap"><div class="board" id="board" style="--cols:${p.cols}" role="group" aria-label="Kreuzworträtsel">${cells}</div></div>
        <details class="lists" id="lists" ${coarse() ? '' : 'open'}><summary>Alle Hinweise</summary><div class="cols">
          <div><span class="label">Waagerecht</span><ol>${list('a')}</ol></div><div><span class="label">Senkrecht</span><ol>${list('d')}</ol></div></div></details>
        <div class="dock">
          <div class="clue" id="clue" aria-live="polite"></div>
          <div class="tools">
            <button class="btn" data-act="tip" id="tip">${I.bulb}<span>Tipp</span></button>
            <button class="btn" data-act="letter">${I.letter}<span>Buchstabe</span></button>
            <button class="btn" data-act="word">${I.eye}<span>Wort<span class="long"> aufdecken</span></span></button>
          </div>${kb}
        </div>
      </div></div>`;
  }
  function paintGame() {
    const s = G.s, p = s.puzzle, e = p.entries[G.sel], set = S.data.settings;
    const inSel = new Set(e.cells);
    root.querySelectorAll('.cell').forEach(el => {
      const c = +el.dataset.c, done = s.cellEntries[c].some(i => s.solved.has(i));
      el.lastElementChild.textContent = s.fill[c] || '';
      el.classList.toggle('sel', inSel.has(c)); el.classList.toggle('cur', c === G.cur);
      el.classList.toggle('ok', done); el.classList.toggle('given', !done && s.given.has(c));
      el.classList.toggle('bad', G.bad.has(c) && !done);
    });
    root.querySelectorAll('#lists li').forEach(li => { const i = +li.dataset.e; li.classList.toggle('on', i === G.sel); li.classList.toggle('done', s.solved.has(i)); });
    const kinds = s.clueKinds(G.sel, set.translations), shown = s.tips[G.sel] || 0, solved = s.solved.has(G.sel);
    const extra = kinds.slice(1, 1 + shown).map(k => `<div class="extra">${CLUE_LABEL[k]}: ${clueText(e, k)}</div>`).join('');
    document.getElementById('clue').innerHTML = `<div class="meta"><b>${e.num} ${e.dir === 'a' ? 'waagerecht' : 'senkrecht'}</b><span>${CLUE_LABEL[kinds[0]]}</span><span>${e.word.kind} · ${e.letters.length} Buchstaben</span></div>
      <div class="text">${clueText(e, kinds[0])}</div>${extra}${G.fb ? `<div class="fb ${G.fb.type}">${G.fb.html}</div>` : ''}`;
    const tip = document.getElementById('tip'); tip.disabled = solved || shown >= kinds.length - 1;
    document.getElementById('count').textContent = `${s.solved.size} von ${p.entries.length} Wörtern`;
    document.getElementById('live').innerHTML = stars(s.stars());
  }
  function animate(cells, cls) {
    if (!S.data.settings.motion) return;
    cells.forEach((c, k) => { const el = root.querySelector(`.cell[data-c="${c}"]`); if (!el) return; el.style.setProperty('--i', k); el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); setTimeout(() => el.classList.remove(cls), 1100); });
  }
  function handle(results) {
    const s = G.s, p = s.puzzle; let good = null, bad = null;
    results.forEach(r => {
      const e = p.entries[r.entry];
      if (r.correct) { good = r; e.cells.forEach(c => G.bad.delete(c)); }
      else if (!bad || r.entry === G.sel) bad = r;
    });
    if (good) {
      const w = p.entries[good.entry].word;
      G.fb = { type: 'good', html: `Richtig: <b>${esc(KW.display(w))}</b> – ${esc(w.en)}${w.article ? ' · Nomen schreibt man groß.' : ''}` };
    } else if (bad) {
      if (S.data.settings.markErrors) bad.wrongCells.forEach(c => G.bad.add(c));
      G.fb = { type: 'bad', html: esc(bad.message) + (S.data.settings.markErrors ? ' Die falschen Felder sind rot markiert.' : '') };
    }
    persist();
    if (s.complete) { paintGame(); results.filter(r => r.correct).forEach(r => animate(p.entries[r.entry].cells, 'pop')); return setTimeout(finish, S.data.settings.motion ? 950 : 200); }
    if (good && s.solved.has(G.sel)) {
      const n = p.entries.length; let j = G.sel;
      for (let k = 1; k <= n; k++) { const i = (G.sel + k) % n; if (!s.solved.has(i)) { j = i; break; } }
      select(j, true);
    }
    paintGame();
    results.forEach(r => r.correct ? animate(p.entries[r.entry].cells, 'pop') : (r.entry === (bad && bad.entry) && animate(p.entries[r.entry].cells, 'shake')));
  }
  function type(ch) {
    const s = G.s, e = s.puzzle.entries[G.sel];
    let cell = G.cur;
    if (s.locked.has(cell)) { const nx = e.cells.slice(e.cells.indexOf(cell) + 1).find(c => !s.locked.has(c)); if (nx == null) return; cell = G.cur = nx; }
    G.bad.delete(cell); G.fb = null;
    const results = s.setLetter(cell, ch);
    const rest = e.cells.slice(e.cells.indexOf(cell) + 1);
    const nx = rest.find(c => !s.locked.has(c) && !s.fill[c]) ?? rest.find(c => !s.locked.has(c));
    if (nx != null) G.cur = nx;
    handle(results);
  }
  function erase() {
    const s = G.s, e = s.puzzle.entries[G.sel]; let k = e.cells.indexOf(G.cur);
    if (s.locked.has(G.cur) || !s.fill[G.cur]) { do k--; while (k >= 0 && s.locked.has(e.cells[k])); if (k < 0) return; G.cur = e.cells[k]; }
    s.fill[G.cur] = ''; G.bad.delete(G.cur); G.fb = null; persist(); paintGame();
  }
  function tapCell(c) {
    const s = G.s, mine = s.cellEntries[c];
    if (c === G.cur && mine.length > 1) G.sel = mine.find(i => i !== G.sel);
    else if (!mine.includes(G.sel)) G.sel = mine.find(i => !s.solved.has(i)) ?? mine[0];
    G.cur = c; G.fb = null; paintGame();
  }
  function move(dr, dc) {
    const p = G.s.puzzle, r = Math.floor(G.cur / p.cols) + dr, c = G.cur % p.cols + dc;
    if (r < 0 || c < 0 || r >= p.rows || c >= p.cols || !G.s.solution[r * p.cols + c]) return;
    G.cur = r * p.cols + c;
    const want = dc ? 'a' : 'd', mine = G.s.cellEntries[G.cur];
    G.sel = mine.find(i => p.entries[i].dir === want) ?? (mine.includes(G.sel) ? G.sel : mine[0]);
    paintGame();
  }
  function step(dir) {
    const s = G.s, n = s.puzzle.entries.length;
    for (let k = 1; k <= n; k++) { const i = (G.sel + dir * k + n * n) % n; if (!s.solved.has(i)) { select(i, true); break; } }
    G.fb = null; paintGame();
  }
  function finish() {
    if (!G || !G.s.complete || ui.screen !== 'game') return;
    ui.result = { res: KW.finishPuzzle(G.s), session: G.s, ref: G.ref };
    go('result'); confetti(ui.result.res.stars);
  }
  function confetti(n) {
    if (!S.data.settings.motion || (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches)) return;
    const box = document.createElement('div'); box.className = 'confetti';
    const colors = ['var(--accent)', 'var(--marker)', 'var(--green)', 'var(--red)', 'var(--gold)'];
    for (let i = 0; i < n * 14; i++) { const el = document.createElement('i'); el.style.cssText = `left:${Math.random() * 100}%;background:${colors[i % 5]};animation-delay:${Math.random() * .5}s;animation-duration:${1.4 + Math.random()}s`; box.appendChild(el); }
    document.body.appendChild(box); setTimeout(() => box.remove(), 3200);
  }

  /* ---------- Ergebnis ---------- */
  function sentence(w) {
    const word = w.ex.startsWith('___') ? w.lemma[0].toUpperCase() + w.lemma.slice(1) : w.lemma;
    return esc(w.ex).replace(/___/g, `<b>${esc(word)}</b>`);
  }
  function wordRow(w, rec, withStats) {
    return `<div class="w"><div><h3>${w.article ? `<i>${w.article}</i> ` : ''}${esc(w.lemma)}</h3><span class="en">${esc(w.en)} · ${w.stage}${w.kind !== 'Wort' ? ' · ' + w.kind : ''}</span></div>
      <button class="hard" data-act="hard" data-w="${esc(w.answer)}" aria-pressed="${!!rec.hard}" aria-label="Als schwierig markieren" title="Als schwierig markieren">${I.flag}</button>
      <div class="ex">${sentence(w)}</div>${withStats ? `<div class="st">${esc(w.def)}<br>${rec.ok}× sicher gelöst · ${rec.bad}× mit Fehler oder Hilfe</div>` : ''}</div>`;
  }
  function result() {
    const { res, session } = ui.result, p = session.puzzle, st = KW.stage(p.stageId);
    const title = ['Geschafft!', 'Gut gemacht!', 'Ausgezeichnet!'][res.stars - 1];
    const why = res.stars === 3 ? 'Ohne Hilfe und fast ohne Fehler gelöst.' : `Tipps, aufgedeckte Felder und Fehlversuche kosten Sterne (${session.penalty} Punkte Abzug). Spiel das Rätsel erneut für drei Sterne.`;
    const nextLv = p.kind === 'level' ? KW.stageLevels(p.stageId)[p.index + 1] : null;
    const nextStage = KW.STAGES[KW.STAGES.indexOf(st) + 1];
    const main = p.kind === 'level'
      ? (nextLv ? `<button class="btn primary" data-act="play" data-id="${nextLv.id}">Nächstes Rätsel ${I.next}</button>`
        : nextStage ? `<button class="btn primary" data-act="stage-go" data-id="${nextStage.id}">Weiter mit ${nextStage.id} ${I.next}</button>` : `<button class="btn primary" data-act="home">Zur Startseite</button>`)
      : `<button class="btn primary" data-act="${S.nextLevel(S.data.stage) ? 'play' : 'home'}" data-id="${(S.nextLevel(S.data.stage) || {}).id || ''}">Weiter lernen ${I.next}</button>`;
    return `<div class="screen result">
      <div class="big">${[0, 1, 2].map(i => `<span class="${i < res.stars ? 'on' : ''}" style="--i:${i}">${I.star}</span>`).join('')}</div>
      <div><h1>${title}</h1><p class="muted">${puzzleLabel(p)} · ${why}</p></div>
      <div class="gains"><span class="chip xp">${I.bolt}+${res.xp} XP${res.replay ? ' (Wiederholung)' : ''}</span><span class="chip flame">${I.flame}${res.streak} ${res.streak === 1 ? 'Tag' : 'Tage'} Lernserie${res.streakUp ? ' · heute verlängert' : ''}</span></div>
      ${res.rankUp ? `<div class="card unlock">${I.medal}<div><b>Neuer Rang: ${res.rankUp.name}</b><br><span class="small">Du hast Rang ${res.rankUp.index} erreicht.</span></div></div>` : ''}
      ${res.achievements.map(a => `<div class="card unlock">${I.medal}<div><b>Erfolg: ${a.name}</b><br><span class="small">${a.text}</span></div></div>`).join('')}
      ${res.stageDone ? `<div class="card unlock">${I.medal}<div><b>Stufe ${st.id} abgeschlossen</b><br><span class="small">Alle ${st.levels} Rätsel gelöst.</span></div></div>` : ''}
      <div class="actions">${main}<button class="btn" data-act="replay">Noch einmal spielen</button><button class="btn" data-act="home">Startseite</button></div>
      <div><span class="label">Wörter aus diesem Rätsel</span><p class="muted small">Lies jeden Satz einmal laut. Mit der Fahne merkst du dir Wörter zum Üben vor.</p></div>
      <div class="card review">${p.entries.map(e => wordRow(e.word, S.wordEntry(e.word.answer))).join('')}</div>
    </div>`;
  }

  /* ---------- Wortliste ---------- */
  function words() {
    const all = S.learnedWords().sort((a, b) => (b.hard - a.hard) || a.word.lemma.localeCompare(b.word.lemma, 'de'));
    const hard = all.filter(w => w.hard), list = ui.filter === 'hard' ? hard : all;
    const pool = hard.length >= 4 ? hard : all;
    return `<div class="screen">${topBar('Wortliste', `${all.length} gelernt · ${hard.length} schwierig`)}
      <div class="filters"><div class="seg" role="group" aria-label="Filter"><button data-act="filter" data-id="all" aria-pressed="${ui.filter === 'all'}">Alle</button><button data-act="filter" data-id="hard" aria-pressed="${ui.filter === 'hard'}">Schwierige</button></div>
        <button class="btn primary" data-act="practice" ${pool.length < 4 ? 'disabled' : ''}>Übungsrätsel ${hard.length >= 4 ? 'aus schwierigen Wörtern' : 'aus meinen Wörtern'}</button></div>
      ${pool.length < 4 ? '<p class="muted small">Ab vier Wörtern in der Liste baut das Spiel daraus ein eigenes Übungsrätsel.</p>' : ''}
      ${list.length ? `<div class="card review">${list.map(w => wordRow(w.word, w, true)).join('')}</div>`
        : `<div class="card empty">${ui.filter === 'hard' ? 'Noch keine schwierigen Wörter. Wörter, die du aufdeckst oder zweimal falsch schreibst, erscheinen hier automatisch.' : 'Hier sammeln sich alle Wörter, die du in Rätseln gelöst hast.'}</div>`}
    </div>`;
  }

  /* ---------- Erfolge ---------- */
  function awards() {
    const d = S.data, total = d.stats.correct + d.stats.wrong;
    return `<div class="screen">${topBar('Erfolge', `${Object.keys(d.achievements).length} von ${KW.ACHIEVEMENTS.length} erreicht`)}
      <div class="facts">
        <div><b>${d.stats.puzzles}</b><span>Rätsel gelöst</span></div><div><b>${S.totalStars()}</b><span>Sterne in Levels</span></div>
        <div><b>${d.stats.correct}</b><span>richtige Wörter</span></div><div><b>${d.stats.wrong}</b><span>Fehlversuche</span></div>
        <div><b>${total ? Math.round(d.stats.correct / total * 100) + ' %' : '–'}</b><span>Trefferquote</span></div><div><b>${d.streak.best}</b><span>längste Serie (Tage)</span></div>
      </div>
      <div class="awards">${KW.ACHIEVEMENTS.map(a => `<div class="award ${d.achievements[a.id] ? 'on' : ''}">${d.achievements[a.id] ? I.medal : I.lock}<div><b>${a.name}</b><span>${a.text}</span></div></div>`).join('')}</div>
    </div>`;
  }

  /* ---------- Einstellungen ---------- */
  function settings() {
    const s = S.data.settings;
    const seg = (key, opts) => `<div class="seg" role="group">${opts.map(([v, t]) => `<button data-act="set" data-key="${key}" data-val="${v}" aria-pressed="${s[key] === v}">${t}</button>`).join('')}</div>`;
    const sw = (key, label) => `<button class="switch" role="switch" data-act="toggle" data-key="${key}" aria-checked="${!!s[key]}" aria-label="${label}"></button>`;
    return `<div class="screen">${topBar('Einstellungen')}
      <section class="card">
        <div class="set"><div><b>Lernstufe</b><p>Bestimmt, welche Rätsel „Spielen“ und das Tagesrätsel verwenden.</p></div><div class="seg" role="group">${KW.STAGES.map(x => `<button data-act="stage" data-id="${x.id}" aria-pressed="${x.id === S.data.stage}">${x.id}</button>`).join('')}</div></div>
        <div class="set"><div><b>Design</b><p>Hell wie ein Schulheft oder dunkel wie eine Tafel.</p></div>${seg('theme', [['system', 'System'], ['light', 'Hell'], ['dark', 'Dunkel']])}</div>
        <div class="set"><div><b>Englische Übersetzungen</b><p>Als Hinweisart und als Tipp. Ausgeschaltet lernst du nur mit deutschen Umschreibungen.</p></div>${sw('translations', 'Englische Übersetzungen')}</div>
        <div class="set"><div><b>Falsche Buchstaben markieren</b><p>Zeigt nach einem Fehlversuch, welche Felder nicht stimmen.</p></div>${sw('markErrors', 'Falsche Buchstaben markieren')}</div>
        <div class="set"><div><b>Animationen</b><p>Bewegung beim Lösen und Konfetti am Ende.</p></div>${sw('motion', 'Animationen')}</div>
        <div class="set"><div><b>Tastatur</b><p>„Eingebaut“ zeigt die Spieltastatur mit ä, ö, ü und ß. „Vom Gerät“ öffnet beim Antippen eines Feldes die Tastatur deines Handys. „Automatisch“ wählt auf Handys die eingebaute.</p></div>${seg('keyboard', [['auto', 'Automatisch'], ['always', 'Eingebaut'], ['never', 'Vom Gerät']])}</div>
      </section>
      <section class="card">
        <div class="set"><div><b>Spielstand</b><p>${S.persistent ? 'Dein Fortschritt wird in diesem Browser gespeichert und bleibt nach dem Schließen erhalten. Auf anderen Geräten beginnt ein eigener Spielstand.' : 'Dieser Browser erlaubt gerade kein Speichern.'}</p></div>
          ${ui.resetArmed ? `<div class="seg"><button class="btn danger" data-act="reset-yes">Wirklich alles löschen</button><button class="btn" data-act="reset-no">Abbrechen</button></div>` : `<button class="btn danger" data-act="reset">Spielstand zurücksetzen</button>`}</div>
      </section></div>`;
  }

  /* ---------- Ereignisse ---------- */
  const actions = {
    home: () => go('home'), levels: () => { ui.tabStage = S.data.stage; go('levels'); }, words: () => go('words'), awards: () => go('awards'), settings: () => go('settings'),
    stage: el => { S.data.stage = el.dataset.id; S.save(); render(); },
    'stage-go': el => { S.data.stage = ui.tabStage = el.dataset.id; S.save(); go('levels'); },
    tab: el => { ui.tabStage = el.dataset.id; render(); },
    play: el => { const l = KW.level(el.dataset.id); if (l && S.isUnlocked(l)) start(l, refOf(l)); },
    resume,
    daily: () => { const p = KW.dailyPuzzle(S.data.stage, KW.today()); start(p, refOf(p)); },
    practice: () => {
      const all = S.learnedWords(), hard = all.filter(w => w.hard), pool = (hard.length >= 4 ? hard : all).map(w => w.word.answer), seed = Date.now().toString(36);
      const p = KW.practicePuzzle(pool, seed); if (p) start(p, refOf(p, { answers: pool, seed }));
    },
    replay: () => { const r = ui.result.ref, p = ui.result.session.puzzle; start(p, r); },
    filter: el => { ui.filter = el.dataset.id; render(); },
    hard: el => { const w = S.wordEntry(el.dataset.w); w.hard = !w.hard; w.auto = false; S.save(); el.setAttribute('aria-pressed', w.hard); },
    set: el => { S.data.settings[el.dataset.key] = el.dataset.val; S.save(); applyTheme(); render(); },
    toggle: el => { const k = el.dataset.key; S.data.settings[k] = !S.data.settings[k]; S.save(); render(); },
    reset: () => { ui.resetArmed = true; render(); }, 'reset-no': () => { ui.resetArmed = false; render(); },
    'reset-yes': () => { S.reset(); G = null; applyTheme(); go('home'); },
    cell: el => tapCell(+el.dataset.c),
    entry: el => { select(+el.dataset.e, true); G.fb = null; paintGame(); },
    key: el => el.dataset.k === 'DEL' ? erase() : type(el.dataset.k),
    tip: () => { if (G.s.takeTip(G.sel, S.data.settings.translations)) { G.fb = null; persist(); paintGame(); } },
    letter: () => {
      const s = G.s, e = s.puzzle.entries[G.sel];
      const c = !s.locked.has(G.cur) ? G.cur : e.cells.find(x => !s.locked.has(x));
      if (c == null) return;
      const res = s.revealLetter(c); if (!res) return;
      G.bad.delete(c); G.fb = { type: 'info', html: 'Ein Buchstabe wurde eingetragen. Das kostet einen Punkt bei den Sternen.' };
      const nx = e.cells.find(x => !s.locked.has(x) && !s.fill[x]); if (nx != null) G.cur = nx;
      res.length ? handle(res) : (persist(), paintGame());
    },
    word: () => { if (!G.s.solved.has(G.sel)) handle(G.s.revealWord(G.sel)); }
  };
  root.addEventListener('click', ev => {
    const el = ev.target.closest('[data-act]');
    if (el && !el.disabled && actions[el.dataset.act]) actions[el.dataset.act](el);
    if (el && ui.screen === 'game' && /^(cell|entry|key|tip|letter|word|play|resume|daily|practice|replay)$/.test(el.dataset.act)) focusSys();
  });
  /* Handy-Tastatur: Ein unsichtbares Textfeld nimmt die Eingabe an. Es enthält immer ein Leerzeichen,
     damit auch die Löschtaste ein Ereignis auslöst. */
  let sysPrev = ' ';
  function focusSys() { const el = document.getElementById('sysin'); if (el && document.activeElement !== el) { el.value = sysPrev = ' '; try { el.focus({ preventScroll: true }); } catch (e) { el.focus(); } try { el.setSelectionRange(1, 1); } catch (e) {} } }
  root.addEventListener('input', ev => {
    const el = ev.target; if (el.id !== 'sysin' || !G) return;
    const v = el.value;
    if (v.length < sysPrev.length) { for (let i = v.length; i < sysPrev.length; i++) erase(); }
    else Array.from(v.replace(/ /g, '')).slice(Array.from(sysPrev.replace(/ /g, '')).length).forEach(c => { const ch = KW.upper(c); if (KW.isLetter(ch) && ui.screen === 'game') type(ch); });
    sysPrev = v;
    if (!ev.isComposing || v.length > 24) el.value = sysPrev = ' ';
  });
  root.addEventListener('compositionend', ev => { if (ev.target.id === 'sysin') ev.target.value = sysPrev = ' '; });
  document.addEventListener('keydown', ev => {
    if (ui.screen !== 'game' || !G || ev.ctrlKey || ev.metaKey || ev.altKey && !/^[äöüßÄÖÜ]$/.test(ev.key)) return;
    const k = ev.key;
    if (k === 'Backspace' || k === 'Delete') { ev.preventDefault(); return erase(); }
    if (k === 'ArrowLeft') { ev.preventDefault(); return move(0, -1); } if (k === 'ArrowRight') { ev.preventDefault(); return move(0, 1); }
    if (k === 'ArrowUp') { ev.preventDefault(); return move(-1, 0); } if (k === 'ArrowDown') { ev.preventDefault(); return move(1, 0); }
    if (k === 'Tab' || k === 'Enter') { if (ev.target.closest && ev.target.closest('.icon-btn, .tools, summary') && k === 'Enter') return; ev.preventDefault(); return step(ev.shiftKey ? -1 : 1); }
    if (k === ' ') { ev.preventDefault(); return tapCell(G.cur); }
    if (k.length === 1) { const ch = KW.upper(k); if (KW.isLetter(ch)) { ev.preventDefault(); type(ch); } }
  });

  /* ---------- Start ---------- */
  S.load(); applyTheme();
  S.streakNow() || (S.data.streak.count = 0);
  render();
  KW.ui = { go, start };
})(KW);
</script>
