name: Android

on:
  push:
    paths: ['src/**', 'build.js', 'index.html', 'android/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: node build.js
      # Mit den Secrets WORTKREUZ_KEYSTORE_BASE64 usw. wird die Release-Version signiert (für Google Play).
      - name: Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.WORTKREUZ_KEYSTORE_BASE64 }}
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "WORTKREUZ_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - name: Build
        working-directory: android
        env:
          WORTKREUZ_STORE_PASSWORD: ${{ secrets.WORTKREUZ_STORE_PASSWORD }}
          WORTKREUZ_KEY_ALIAS: ${{ secrets.WORTKREUZ_KEY_ALIAS }}
          WORTKREUZ_KEY_PASSWORD: ${{ secrets.WORTKREUZ_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleDebug assembleRelease bundleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: wortkreuz-android
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/bundle/release/*.aab
